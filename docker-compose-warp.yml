services:
  warp-proxy:
    image: caomingjun/warp:latest
    container_name: chat2api-warp-proxy
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 10:200 rwm'
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      TZ: Asia/Shanghai
      WARP_SLEEP: '2'
    volumes:
      - /data/volumes/chat2api/warp:/var/lib/cloudflare-warp
    ports:
      - '127.0.0.1:40001:1080'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace | grep -qE 'warp=(plus|on)'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    image: ghcr.io/fangzhengjin/chat2api:next
    container_name: chat2api-warp
    restart: unless-stopped
    pull_policy: always
    env_file:
      - /data/volumes/chat2api/.env
    environment:
      TZ: Asia/Shanghai
      PROXY_URL: 'socks5://warp-proxy:1080'
      INIT_APPLY_ON_EMPTY: 'true'
      INIT_FORCE: 'false'
    ports:
      - '60403:5005'
    volumes:
      - /data/volumes/chat2api/data:/app/data
    depends_on:
      warp-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 5005), 5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
