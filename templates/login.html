<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-300 via-indigo-300 to-purple-400 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-96 max-w-md">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">访问 Chat</h2>
        <p class="text-sm text-gray-500 text-center mb-6">请输入管理员为账号生成的访问密码</p>
        {% if error %}
        <p class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600">{{ error }}</p>
        {% endif %}
        <form method="post" action="/login" class="space-y-4">
            <label for="password" class="block text-sm font-semibold text-gray-700">访问密码</label>
            <input
                id="password"
                name="password"
                type="password"
                required
                autofocus
                autocomplete="current-password"
                class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-800 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            >
            <button
                type="submit"
                class="w-full rounded-lg bg-gradient-to-r from-indigo-500 to-blue-500 px-4 py-3 font-bold text-white hover:opacity-90"
            >
                验证并进入
            </button>
        </form>
    </div>
</body>
</html>
